<style>
:root{--bg:#F6F1EE;--card:#FFFFFF;--ink:#1E1A16;--mute:#7A6F65;--line:#E8DFD6;--acc:#8E7A5F;--acc-ink:#fff;--btn:#1E1A16;--btn-ink:#F6F1EE;--hi:#DCC9AA;--danger:#B2483A;--shadow:0 1px 2px rgba(70,50,30,.05),0 8px 24px rgba(70,50,30,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1713;--card:#25201B;--ink:#F3ECE3;--mute:#A89B8D;--line:#3A332C;--acc:#CBB591;--acc-ink:#1B1713;--btn:#F0E7DC;--btn-ink:#1B1713;--hi:#CDB48E;--danger:#E58B7E;--shadow:none}}
:root[data-theme="dark"]{--bg:#1B1713;--card:#25201B;--ink:#F3ECE3;--mute:#A89B8D;--line:#3A332C;--acc:#CBB591;--acc-ink:#1B1713;--btn:#F0E7DC;--btn-ink:#1B1713;--hi:#CDB48E;--danger:#E58B7E;--shadow:none}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 14px 72px}
h1.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand{background:#F6F1EE;border-radius:24px;padding:10px 12px;margin:0 0 16px;text-align:center}
.brand img{display:block;width:min(100%,360px);height:auto;margin:0 auto}
.sub{color:var(--mute);margin:0 0 14px}
nav{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:999px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
nav button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:500;padding:11px 4px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.n{display:inline-block;min-width:1.4em;background:var(--hi);color:#2A2118;border-radius:99px;font-size:.78rem;padding:0 6px;margin-left:4px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card>strong,.daycard .row strong,.h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;font-weight:600;letter-spacing:.01em}
label.l{display:block;font-weight:500;color:var(--mute);font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;margin:12px 0 5px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:46px}
.hint{color:var(--mute);font-size:.88rem;margin:4px 0 0}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:11px 22px;cursor:pointer;background:var(--btn);color:var(--btn-ink);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.9rem;min-height:38px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ing{display:grid;grid-template-columns:72px 92px 1fr 40px;gap:6px;margin-bottom:6px}
.ing .x{min-height:44px}
.dish h3{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.45rem;font-weight:600;line-height:1.15}
.dish ul{margin:6px 0 10px;padding-left:18px;color:var(--mute);font-size:.92rem}
.pick{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600;margin:0}
.pick input,.item input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc);flex:none}
.dish.on{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc),var(--shadow)}
.item{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:600}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.src{display:block;color:var(--mute);font-size:.78rem}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.3rem;cursor:pointer;line-height:1}
.step span{min-width:3.4em;text-align:center;font-weight:600;font-size:.95rem}
.x{background:none;border:0;color:var(--danger);font-size:1.4rem;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
#msg{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;z-index:5}
@media (min-width:820px){
main{max-width:1000px;padding:24px 28px 72px}
#v-dishes{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
#form{position:sticky;top:76px}
#weeklist{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
#weeklist .card{margin-bottom:0}
}
.dimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:10px;display:block;background:var(--line)}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
.wd{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.wd .nm{font-weight:600;min-width:0}
.handle{touch-action:none;cursor:grab;padding:8px 8px;font-size:1.3rem;color:var(--mute);user-select:none;-webkit-user-select:none;flex:none}
.dsel,.msel{width:auto;min-height:38px;padding:4px 6px;font-size:15px;flex:none}
.daycard.off{border-style:dashed;background:var(--bg)}
.daycard.over,.pool.over{border-color:var(--acc);box-shadow:0 0 0 3px var(--hi)}
.daycard .note{margin:8px 0 4px}
.dragghost{position:fixed;z-index:50;pointer-events:none;background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.25);margin:0}
.pool{grid-column:1/-1}
.areas{display:flex;gap:8px;margin:0 0 12px}
.areas button{flex:1;font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 4px;min-height:44px;cursor:pointer;white-space:nowrap}
.areas button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.wd input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc);flex:none}
.wd.done .nm{text-decoration:line-through;color:var(--mute)}
.wd .nm .src{font-weight:400}
.gc .hint{margin:4px 0 8px}
@media (min-width:820px){#gweek{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}#gweek .card{margin-bottom:0}}
.areas{gap:6px}.areas button{font-size:.92rem;padding:10px 2px}
.cal{padding:12px 8px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 4px}
.calttl{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;font-weight:600}
.calnav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.calgrid.wk div{font-size:.72rem;color:var(--mute);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cd{border:0;background:none;color:var(--ink);font:inherit;padding:2px 0 4px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.cd .dn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:1.05rem;font-weight:500}
.cd.mute .dn{color:var(--mute);opacity:.5}
.cd.today .dn{background:var(--acc);color:var(--acc-ink)}
.cd.sel:not(.today) .dn{background:var(--btn);color:var(--btn-ink)}
.cd.sel.today .dn{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--acc);display:block}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.ev .tm{width:64px;flex:none;font-size:.85rem;color:var(--mute);text-align:right;line-height:1.3}
.ev .bar{width:3px;border-radius:2px;background:var(--acc);flex:none}
.ev b{font-weight:600}
.dt{font-family:"DM Sans",system-ui,sans-serif;font-size:.8rem;color:var(--mute);font-weight:400;margin-left:4px}
.evl{margin:4px 0 6px}
.dots i.p{background:transparent;border:1.5px solid var(--acc)}
.plsec{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.plh{width:64px;flex:none;font-size:.74rem;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;padding-top:5px}
.pli{padding:4px 0;display:flex}
.wbar{padding:10px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chp{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;min-width:40px;height:36px;padding:0 8px;font:inherit;font-size:.85rem;cursor:pointer}
.chp.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.rpt{margin:8px 0 10px}.rpt .src{margin-bottom:6px}
.rp{color:var(--acc);font-weight:700}
.h2{font-size:1.05rem;margin:18px 0 6px;color:var(--mute)}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:.85rem;padding:4px 0;cursor:pointer;text-decoration:underline}
.chip{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 2px 2px 12px;margin:3px}
.chip .x{padding:2px 10px}
nav button{font-size:.9rem;white-space:nowrap;padding:11px 2px}
body.out nav,body.out section,body.out .areas{display:none!important}
.err{color:var(--danger);margin:8px 0 0;min-height:1.2em}
[hidden]{display:none!important}
</style>
</head>

<script>
(function(){
var UNITS=["","g","kg","ml","l","Stk","EL","TL","Pck","Dose","Bund"];
var dishes=[],manual=[],pantry=[],ist={},db=null,tab="dishes",editId=null,ingRows=[],daysMap={},area="food",gtab="list",G={haushalt:[],todos:[]},formImg="",drag=null,pendRender=false;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(t){var m=$("msg");m.textContent=t;m.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){m.hidden=true},3500)}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return "k"+(h>>>0).toString(36)}
function norm(x){return String(x).toLowerCase().trim()}
function mt(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(b.length>=3&&a.indexOf(b)>=0)||(a.length>=3&&b.indexOf(a)>=0)}
function have(n){return pantry.some(function(p){return mt(n,p.name)})}
function addPantry(name){name=name.trim();if(!name||!db)return;if(pantry.some(function(p){return norm(p.name)===norm(name)}))return;guard(db.collection("pantry").add({name:name}))}
function itemById(id){return allItems().filter(function(x){return x.kind==="d"&&x.id===id})[0]}
function toPantry(id){var it=itemById(id);if(it)addPantry(it.n)}
function outPantry(id){var it=itemById(id);if(it)pantry.filter(function(p){return mt(it.n,p.name)}).forEach(function(p){guard(db.collection("pantry").doc(p.id).delete())})}
function im(d){return d.img?'<img class="dimg" alt="" loading="lazy" src="'+d.img+'">':''}
function offDay(d){if(d===null||d===undefined)return false;var m=daysMap["d"+d];return !!m&&!!m.mode&&m.mode!=="cook"}
function setDayIn(col,id,day){if(db)guard(db.collection(col).doc(id).update({day:day}))}
function setDay(id,day){setDayIn("dishes",id,day)}
function setMode(i,m){var c=daysMap["d"+i]||{};guard(db.collection("days").doc("d"+i).set({mode:m,note:c.note||""}))}
function setNote(i,v){var c=daysMap["d"+i]||{};guard(db.collection("days").doc("d"+i).set({mode:c.mode||"cook",note:v.trim()}))}
function resizeImg(file,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var k=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.72))};i.onerror=function(){toast("Bild konnte nicht gelesen werden.")};i.src=r.result};r.readAsDataURL(file)}
function setImg(v){formImg=v;$("imgp").innerHTML=v?'<img class="dimg" alt="Vorschau" src="'+v+'">':"";$("imgx").hidden=!v;$("imgb").textContent=v?"Bild ändern":"Bild wählen"}
function num(v){var x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:null}
function fq(q){return String(Math.round(q*100)/100).replace(".",",")}
function stepFor(u){return u==="g"||u==="ml"?50:(u==="kg"||u==="l"?0.5:1)}
function guard(p){return Promise.resolve(p).catch(function(){toast("Speichern nicht möglich. Dir fehlt evtl. die Schreibberechtigung.")})}

function setTab(t){tab=t;["dishes","week","shop","home"].forEach(function(n){$("v-"+n).hidden=n!==t;$("t-"+n).setAttribute("aria-selected",n===t)});render()}
$("t-dishes").onclick=function(){setTab("dishes")};
$("t-week").onclick=function(){setTab("week")};
$("t-shop").onclick=function(){setTab("shop")};
$("t-home").onclick=function(){setTab("home")};

/* Zutaten-Formular */
function drawIngs(){
  $("ings").innerHTML=ingRows.map(function(r,i){
    return '<div class="ing"><input type="number" inputmode="decimal" step="any" min="0" placeholder="Menge" aria-label="Menge" data-i="'+i+'" data-f="q" value="'+esc(r.q)+'">'+
    '<select aria-label="Einheit" data-i="'+i+'" data-f="u">'+UNITS.map(function(u){return '<option value="'+u+'"'+(u===r.u?" selected":"")+'>'+(u||"–")+'</option>'}).join("")+'</select>'+
    '<input type="text" placeholder="Zutat" aria-label="Zutat" autocomplete="off" data-i="'+i+'" data-f="n" value="'+esc(r.n)+'">'+
    '<button class="x" data-rm="'+i+'" aria-label="Zutat entfernen">×</button></div>'}).join("");
}
function resetForm(){editId=null;setImg("");$("dn").value="";ingRows=[{q:"",u:"",n:""}];$("ftitle").textContent="Neues Gericht";$("cancel").hidden=true;drawIngs()}
$("adding").onclick=function(){ingRows.push({q:"",u:"",n:""});drawIngs();var l=$("ings").querySelectorAll('input[data-f="n"]');l[l.length-1].focus()};
$("ings").addEventListener("input",function(e){var t=e.target,i=t.getAttribute("data-i");if(i!==null)ingRows[i][t.getAttribute("data-f")]=t.value});
$("ings").addEventListener("change",function(e){var t=e.target,i=t.getAttribute("data-i");if(i!==null)ingRows[i][t.getAttribute("data-f")]=t.value});

function derived(){
  var map={},order=[];
  dishes.filter(function(d){return d.week&&!offDay(d.day)}).forEach(function(d){
    (d.ing||[]).forEach(function(r){
      var u=r.u||"",key=u.toLowerCase()+"|"+r.n.toLowerCase(),q=r.q===null||r.q===undefined?1:r.q;
      if(map[key]){map[key].q+=q;if(map[key].src.indexOf(d.name)<0)map[key].src.push(d.name)}
      else{map[key]={kind:"d",id:hash(key),key:key,q:q,u:u,n:r.n,src:[d.name]};order.push(key)}
    });
  });
  return order.map(function(k){var it=map[k],s=ist[it.id]||{};it.delta=s.delta||0;it.checked=!!s.checked;it.home=have(it.n);it.eq=Math.max(0,Math.round((it.q+it.delta)*100)/100);return it});
}
function allItems(){
  var m=manual.map(function(x){return{kind:"m",id:x.id,q:x.q,eq:x.q,u:x.u||"",n:x.name,checked:!!x.checked,home:false,src:[]}});
  return derived().concat(m);
}
function adjust(kind,id,dir){
  var it=allItems().filter(function(x){return x.kind===kind&&x.id===id})[0];if(!it)return;
  var st=stepFor(it.u),nq=Math.max(0,Math.round((it.eq+dir*st)*100)/100);
  if(kind==="m")guard(db.collection("manual").doc(id).update({q:nq}));
  else{var s=ist[id]||{};guard(db.collection("istate").doc(id).set({delta:Math.round((nq-it.q)*100)/100,checked:!!s.checked}))}
}
function check(kind,id,v){

}

function supaDb(sb){
  var cache={},subs={};
  function snap(col){var m=cache[col]||{};return{docs:Object.keys(m).map(function(id){return{id:id,data:function(){return m[id]}}})}}
  function emit(col){(subs[col]||[]).forEach(function(f){f(snap(col))})}
  function fail(r){if(r.error){load();throw r.error}}
  function put(col,id,data){(cache[col]=cache[col]||{})[id]=data;emit(col);return sb.from("items").upsert({col:col,id:id,data:data}).then(fail)}
  function del(col,id){if(cache[col])delete cache[col][id];emit(col);return sb.from("items").delete().eq("col",col).eq("id",id).then(fail)}
  async function load(){var r=await sb.from("items").select("col,id,data");if(r.error)throw r.error;cache={};r.data.forEach(function(x){(cache[x.col]=cache[x.col]||{})[x.id]=x.data});Object.keys(subs).forEach(emit)}
  sb.channel("items-live").on("postgres_changes",{event:"*",schema:"public",table:"items"},function(p){
    var row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.col)return;
    var c=cache[row.col]=cache[row.col]||{};
    if(p.eventType==="DELETE")delete c[row.id];else c[row.id]=row.data;
    emit(row.col)}).subscribe();
  function docRef(col,id){return{id:id,
    set:function(d){return put(col,id,d)},
    update:function(d){return put(col,id,Object.assign({},(cache[col]||{})[id]||{},d))},
    delete:function(){return del(col,id)}}}
  return{load:load,collection:function(col){return{
    doc:function(id){return docRef(col,id||crypto.randomUUID())},
    add:function(d){var id=crypto.randomUUID();return put(col,id,d).then(function(){return docRef(col,id)})},
    onSnapshot:function(next){(subs[col]=subs[col]||[]).push(next);next(snap(col));return function(){}}}}}
}

  else if(id=t.getAttribute("data-gw2")){upG(id,{week:false,day:null})}

    var q=id.split("~"),it2=G[area].filter(function(x){return x.id===q[0]})[0];
    if(it2){var r=it2.repeat.slice(),ix=r.indexOf(+q[1]);if(ix>=0)r.splice(ix,1);else r.push(+q[1]);r.sort();upG(it2.id,{repeat:r})}}
  else if(t.getAttribute("data-nr")!==null){
    var n=+t.getAttribute("data-nr"),j=newRepeat.indexOf(n);if(j>=0)newRepeat.splice(j,1);else newRepeat.push(n);newRepeat.sort();renderG()}});
document.addEventListener("change",function(e){
  var t=e.target,id;if(!t.getAttribute||area==="food")return;
  if(id=t.getAttribute("data-gw")){upG(id,{week:t.checked,day:null})}
  else if(id=t.getAttribute("data-gc")){upG(id,{done:t.checked})}
  else if(id=t.getAttribute("data-gdd")){setDayIn(area,id,t.value===""?null:+t.value)}
  else if(id=t.getAttribute("data-gr")){var q=id.split("~");toggleOcc(area,q[0],q[1],t.checked)}});
function renderG(){
  var m=GM[area],list=G[area],base=list.filter(function(d){return !d.repeat.length}),wk=base.filter(function(d){return d.week});
  $("gtitle").textContent=m.t;$("gi").placeholder=m.ph;$("gclean").hidden=area!=="todos";
  var open=wk.filter(function(d){return !d.done}).length;
  for(var q=0;q<7;q++)occFor(list,q).forEach(function(o){if(o.rec&&!o.done)open++});
  $("gcw").textContent=open;
  $("gnr").innerHTML=chips(newRepeat,"data-nr","");
  if(gtab==="list"){
    $("glist").innerHTML=list.length?list.map(function(d){var rec=d.repeat.length>0;
      return '<div class="card dish'+(d.week&&!rec?" on":"")+'"><h3'+(d.done&&!rec?' style="text-decoration:line-through;color:var(--mute)"':'')+'>'+esc(d.title)+'</h3>'+(d.note?'<p class="hint">'+esc(d.note)+'</p>':'')+
      '<div class="rpt"><span class="src">Wiederholt jede Woche am</span><div class="chips">'+chips(d.repeat,"data-rp",d.id+"~")+'</div></div>'+
      '<div class="row">'+(rec?'<span class="hint grow">Erscheint automatisch in jeder Woche.</span>':'<label class="pick"><input type="checkbox" data-gw="'+d.id+'"'+(d.week?" checked":"")+'>Diese Woche</label><span class="grow"></span>')+'<button class="x" data-gx="'+d.id+'" aria-label="'+esc(d.title)+' l\u00f6schen">\u00d7</button></div></div>'}).join("")
      :'<div class="empty">'+m.eL+'</div>';
  }else{
    var dsel=function(d){return '<select class="dsel" data-gdd="'+d.id+'" aria-label="Tag f\u00fcr '+esc(d.title)+'"><option value="">Tag</option>'+DAYS.map(function(n,i){return '<option value="'+i+'"'+(d.day===i?" selected":"")+'>'+n.slice(0,2)+'</option>'}).join("")+'</select>'};
    var row=function(o){var d=o.d;
      return '<div class="wd'+(o.done?" done":"")+'"><input type="checkbox" '+(o.rec?'data-gr="'+d.id+'~'+o.k+'"':'data-gc="'+d.id+'"')+(o.done?" checked":"")+' aria-label="erledigt"><span class="grow nm">'+(o.rec?'<span class="rp" title="wiederkehrend">\u21bb</span> ':'')+esc(d.title)+(d.note?'<span class="src">'+esc(d.note)+'</span>':'')+'</span>'+
      (o.rec?'':dsel(d)+'<span class="handle" data-drag="'+d.id+'" data-col="'+area+'" role="img" aria-label="Verschieben">\u283f</span><button class="x" data-gw2="'+d.id+'" aria-label="'+esc(d.title)+' aus der Woche entfernen">\u00d7</button>')+'</div>'};
    var pool=wk.filter(function(d){return d.day===null}),anyRec=list.some(function(d){return d.repeat.length});
    var h=weekBar()+'<div class="card pool" data-dropday="-1"><strong>Noch ohne Tag</strong>'+(pool.length?pool.map(function(d){return row({d:d,done:d.done,rec:false})}).join(""):'<p class="hint">'+(wk.length?'Alles hat einen Tag.':(anyRec?'Keine Eintr\u00e4ge ohne Tag.':m.eW))+'</p>')+'</div>';
    for(var i=0;i<7;i++){
      var ds=occFor(list,i);
      h+='<div class="card daycard" data-dropday="'+i+'"><strong>'+DAYS[i]+' <span class="dt">'+shortD(dayKey(i))+'</span>'+(dayKey(i)===ymd(new Date())?' <span class="n">heute</span>':'')+'</strong>'+evLine(i)+ds.map(row).join("")+(ds.length?'':'<p class="hint">Hierher ziehen oder \u00fcber \u201eTag\u201c w\u00e4hlen.</p>')+'</div>'}
    $("gweek").innerHTML=h;
  }
}

/* ---------- Kalender ---------- */
var events=[],calY=new Date().getFullYear(),calM=new Date().getMonth(),selD="",evId=null;
var MON=["Januar","Februar","M\u00e4rz","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function p2(n){return (n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
selD=ymd(new Date());
function evOn(k){return events.filter(function(e){return e.date===k}).sort(function(a,b){return (b.allDay-a.allDay)||a.time.localeCompare(b.time)||a.title.localeCompare(b.title,"de")})}
function renderCal(){
  $("cttl").textContent=MON[calM]+" "+calY;
  var off=(new Date(calY,calM,1).getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate(),rows=Math.ceil((off+dim)/7),tk=ymd(new Date()),by={},h="";
  events.forEach(function(e){by[e.date]=(by[e.date]||0)+1});
  var pk={};for(var j=0;j<7;j++){if(planCount(planFor(j)))pk[dayKey(j)]=1}
  for(var i=0;i<rows*7;i++){
    var d=new Date(calY,calM,1-off+i),k=ymd(d),n=by[k]||0;
    h+='<button class="cd'+(d.getMonth()!==calM?" mute":"")+(k===tk?" today":"")+(k===selD?" sel":"")+'" data-cd="'+k+'" aria-label="'+esc(d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})+(n?", "+n+(n>1?" Termine":" Termin"):""))+'"><span class="dn">'+d.getDate()+'</span><span class="dots">'+new Array(Math.min(n,3)+1).join("<i></i>")+(pk[k]?'<i class="p"></i>':"")+'</span></button>'}
  $("cgrid").innerHTML=h;
  var p=selD.split("-");
  $("cdaytitle").textContent=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  var ix=dayIndexOf(selD),pl=$("cplan");
  if(ix<0){pl.hidden=true}else{
    var pp=planFor(ix),h2="";
    var sec=function(t,body){return '<div class="plsec"><span class="plh">'+t+'</span><div class="grow">'+body+'</div></div>'};
    if(pp.mode==="out")h2+=sec("Essen","Essen gehen"+(pp.note?": "+esc(pp.note):""));
    else if(pp.mode==="order")h2+=sec("Essen","Bestellen"+(pp.note?": "+esc(pp.note):""));
    else if(pp.ds.length)h2+=sec("Essen",pp.ds.map(function(d){return '<div class="pli">'+esc(d.name)+'</div>'}).join(""));
    var chk=function(col){return function(o){var d=o.d;return '<label class="pli pick"><input type="checkbox" '+(o.rec?'data-cr="'+col+'~'+d.id+'~'+o.k+'"':'data-cg="'+col+'~'+d.id+'"')+(o.done?" checked":"")+'><span'+(o.done?' style="text-decoration:line-through;color:var(--mute)"':'')+'>'+(o.rec?'<span class="rp">\u21bb</span> ':'')+esc(d.title)+'</span></label>'}};
    if(pp.hs.length)h2+=sec("Haushalt",pp.hs.map(chk("haushalt")).join(""));
    if(pp.ts.length)h2+=sec("To-dos",pp.ts.map(chk("todos")).join(""));
    pl.innerHTML='<strong>Plan f\u00fcr diesen Tag</strong>'+(h2||'<p class="hint">Nichts geplant.</p>');pl.hidden=false}
  var list=evOn(selD);
  $("clist").innerHTML=list.length?list.map(function(e){return '<div class="ev" role="button" tabindex="0" data-ce="'+e.id+'"><span class="tm">'+(e.allDay?"ganzt\u00e4gig":esc(e.time)+(e.end?"<br>"+esc(e.end):""))+'</span><span class="bar"></span><span class="grow"><b>'+esc(e.title)+'</b>'+(e.note?'<span class="src">'+esc(e.note)+'</span>':"")+'</span></div>'}).join(""):'<p class="hint">Keine Termine an diesem Tag.</p>';
}
function moveMonth(n){
  calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}
  var now=new Date();selD=(calY===now.getFullYear()&&calM===now.getMonth())?ymd(now):calY+"-"+p2(calM+1)+"-01";render()}
$("cprev").onclick=function(){moveMonth(-1)};
$("cnext").onclick=function(){moveMonth(1)};
$("ctoday").onclick=function(){var n=new Date();calY=n.getFullYear();calM=n.getMonth();selD=ymd(n);closeEv();render()};
var sx=null,sy=null;
$("cgrid").addEventListener("touchstart",function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
$("cgrid").addEventListener("touchend",function(e){if(sx===null)return;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dy)<40)moveMonth(dx<0?1:-1)},{passive:true});
function timeVis(){$("ctimes").hidden=$("call").checked}
function openEv(id){
  var e=id?events.filter(function(x){return x.id===id})[0]:null;evId=e?e.id:null;
  $("cform").hidden=false;$("cft").textContent=e?"Termin bearbeiten":"Neuer Termin";
  $("ctitle").value=e?e.title:"";$("call").checked=e?e.allDay:false;$("cdate").value=e?e.date:selD;
  $("cfrom").value=e?e.time:"";$("cto").value=e?e.end:"";$("cnote").value=e?e.note:"";$("cdel").hidden=!e;
  timeVis();$("cform").scrollIntoView({behavior:"smooth"})}
function closeEv(){evId=null;$("cform").hidden=true}
$("cadd").onclick=function(){openEv(null)};
$("call").onchange=timeVis;
$("ccancel").onclick=closeEv;
$("csave").onclick=function(){
  var t=$("ctitle").value.trim(),dt=$("cdate").value;
  if(!t){$("ctitle").focus();return}if(!dt){$("cdate").focus();return}if(!db)return;
  var all=$("call").checked,data={title:t,date:dt,allDay:all,time:all?"":$("cfrom").value,end:all?"":$("cto").value,note:$("cnote").value.trim()};
  guard((evId?db.collection("events").doc(evId):db.collection("events").doc()).set(data));
  var p=dt.split("-");selD=dt;calY=+p[0];calM=+p[1]-1;closeEv();render()};
$("cdel").onclick=function(){
  var e=events.filter(function(x){return x.id===evId})[0];
  if(e&&db&&confirm("\u201e"+e.title+"\u201c l\u00f6schen?")){guard(db.collection("events").doc(evId).delete());closeEv()}};
document.addEventListener("click",function(e){
  if(area!=="kalender"||!e.target.closest)return;
  var c=e.target.closest("[data-cd]");
  if(c){selD=c.getAttribute("data-cd");var p=selD.split("-");calY=+p[0];calM=+p[1]-1;render();return}
  c=e.target.closest("[data-ce]");if(c)openEv(c.getAttribute("data-ce"))});
document.addEventListener("keydown",function(e){
  if(area==="kalender"&&(e.key==="Enter"||e.key===" ")&&e.target.getAttribute&&e.target.getAttribute("data-ce")){e.preventDefault();openEv(e.target.getAttribute("data-ce"))}});
/* ---------- Verkn\u00fcpfung Kalender und Wochenplan ---------- */
var planStart=null;
function dUTC(k){var p=k.split("-");return Date.UTC(+p[0],+p[1]-1,+p[2])}
function mondayOf(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7))}
function addDays(k,n){var p=k.split("-");return ymd(new Date(+p[0],+p[1]-1,+p[2]+n))}
function pStart(){return planStart||ymd(mondayOf(new Date()))}
function dayKey(i){return addDays(pStart(),i)}
function dayIndexOf(k){var x=Math.round((dUTC(k)-dUTC(pStart()))/864e5);return x>=0&&x<=6?x:-1}
function shortD(k){var p=k.split("-");return p[2]+"."+p[1]+"."}
function evLine(i){var es=evOn(dayKey(i));return es.length?'<p class="src evl">Termin: '+es.map(function(e){return esc((e.allDay?"ganzt\u00e4gig":e.time)+" "+e.title)}).join(" \u00b7 ")+'</p>':""}
function weekBar(){
  var ps=pStart(),end=addDays(ps,6),diff=Math.round((dUTC(ps)-dUTC(ymd(mondayOf(new Date()))))/6048e5);
  var tag=diff===0?"Aktuelle Woche":diff===1?"N\u00e4chste Woche":diff===-1?"Letzte Woche":diff>1?"in "+diff+" Wochen":"vor "+(-diff)+" Wochen";
  return '<div class="card wbar pool row" style="flex-wrap:nowrap"><button class="calnav" data-wk="-1" aria-label="Vorherige Woche">\u2039</button><div class="grow" style="text-align:center"><b>'+shortD(ps)+" \u2013 "+shortD(end)+end.slice(0,4)+'</b><span class="src">'+tag+'</span></div><button class="calnav" data-wk="1" aria-label="N\u00e4chste Woche">\u203a</button></div>'}
function planFor(i){
  var dm=daysMap["d"+i]||{},mode=dm.mode||"cook";
  return{mode:mode,note:dm.note||"",
    ds:mode==="cook"?dishes.filter(function(d){return d.week&&d.day===i}):[],
    hs:occFor(G.haushalt,i),
    ts:occFor(G.todos,i)}}
function planCount(p){return (p.mode!=="cook"?1:0)+p.ds.length+p.hs.length+p.ts.length}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-wk]");if(!b||!db)return;
  guard(db.collection("meta").doc("plan").set({start:addDays(pStart(),7*(+b.getAttribute("data-wk")))}))});
document.addEventListener("change",function(e){
  var t=e.target,v=t.getAttribute&&t.getAttribute("data-cg"),r=t.getAttribute&&t.getAttribute("data-cr");
  if(r){var q=r.split("~");toggleOcc(q[0],q[1],q[2],t.checked);return}
  if(!v||!db)return;
  var p=v.split("~");guard(db.collection(p[0]).doc(p[1]).update({done:t.checked}))});
function sub(col,fn){db.collection(col).onSnapshot(function(s){fn(s);render()})}
(async function(){
  if(typeof supabase==="undefined"||/^DEINE/.test(SUPABASE_URL)){toast("Supabase ist noch nicht eingetragen (URL und Key oben in der Datei).");return}
  var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  var ses=(await sb.auth.getSession()).data.session;
  if(!ses){
    $("login").hidden=false;
    $("lgo").onclick=async function(){
      var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
      if(r.error){$("lerr").textContent="Anmeldung fehlgeschlagen. Bitte E-Mail und Passwort prüfen.";return}
      location.reload()};
    return}
  db=supaDb(sb);
  try{await db.load()}catch(e){toast("Laden fehlgeschlagen. Ist die Tabelle angelegt?");return}
  document.body.className="";
  sub("dishes",function(s){dishes=s.docs.map(function(d){var x=d.data();return{id:d.id,name:x.name||"",ing:x.ing||[],week:!!x.week,img:x.img||"",day:typeof x.day==="number"?x.day:null}}).sort(function(a,b){return a.name.localeCompare(b.name,"de")})});
  sub("manual",function(s){manual=s.docs.map(function(d){var x=d.data();return{id:d.id,name:x.name||"",q:typeof x.q==="number"?x.q:1,u:x.u||"",checked:!!x.checked}})});
  sub("istate",function(s){ist={};s.docs.forEach(function(d){ist[d.id]=d.data()})});
  sub("days",function(s){daysMap={};s.docs.forEach(function(d){daysMap[d.id]=d.data()})});
  sub("haushalt",function(s){G.haushalt=mapG(s)});
  sub("todos",function(s){G.todos=mapG(s)});
  sub("events",function(s){events=s.docs.map(function(d){var x=d.data();return{id:d.id,title:x.title||"",date:x.date||"",allDay:!!x.allDay,time:x.time||"",end:x.end||"",note:x.note||""}})});
  sub("meta",function(s){var d=s.docs.filter(function(x){return x.id==="plan"})[0];planStart=d&&d.data().start?d.data().start:null});
  sub("pantry",function(s){pantry=s.docs.map(function(d){return{id:d.id,name:d.data().name||""}}).sort(function(a,b){return a.name.localeCompare(b.name,"de")})});
})();
})();
</script>
