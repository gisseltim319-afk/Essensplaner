<style>
:root{--bg:#F1F5F0;--card:#fff;--ink:#1E2B25;--mute:#5F6F66;--line:#D6DFD8;--acc:#1F6F5C;--acc-ink:#fff;--hi:#F2C94C;--danger:#B3372B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141C18;--card:#1D2823;--ink:#E8EFEA;--mute:#93A59B;--line:#2E3C35;--acc:#4DB89C;--acc-ink:#0E1612;--hi:#E0B73A;--danger:#E27B6E}}
:root[data-theme="dark"]{--bg:#141C18;--card:#1D2823;--ink:#E8EFEA;--mute:#93A59B;--line:#2E3C35;--acc:#4DB89C;--acc-ink:#0E1612;--hi:#E0B73A;--danger:#E27B6E}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 14px 72px}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
nav{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
nav button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:11px 4px;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.n{display:inline-block;min-width:1.4em;background:var(--hi);color:#1E2B25;border-radius:99px;font-size:.78rem;padding:0 6px;margin-left:4px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label.l{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=password],input[type=number],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.hint{color:var(--mute);font-size:.88rem;margin:4px 0 0}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--acc);color:var(--acc-ink);min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.9rem;min-height:38px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ing{display:grid;grid-template-columns:72px 92px 1fr 40px;gap:6px;margin-bottom:6px}
.ing .x{min-height:44px}
.dish h3{margin:0;font-size:1.1rem}
.dish ul{margin:6px 0 10px;padding-left:18px;color:var(--mute);font-size:.92rem}
.pick{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600;margin:0}
.pick input,.item input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc);flex:none}
.dish.on{border-color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)}
.item{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:600}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.src{display:block;color:var(--mute);font-size:.78rem}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.3rem;cursor:pointer;line-height:1}
.step span{min-width:3.4em;text-align:center;font-weight:600;font-size:.95rem}
.x{background:none;border:0;color:var(--danger);font-size:1.4rem;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
#msg{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;z-index:5}
@media (min-width:820px){
main{max-width:1000px;padding:24px 28px 72px}
#v-dishes{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
#form{position:sticky;top:76px}
#weeklist{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
#weeklist .card{margin-bottom:0}
}
.h2{font-size:1.05rem;margin:18px 0 6px;color:var(--mute)}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:.85rem;padding:4px 0;cursor:pointer;text-decoration:underline}
.chip{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 2px 2px 12px;margin:3px}
.chip .x{padding:2px 10px}
nav button{font-size:.95rem}
body.out nav,body.out section{display:none!important}
.err{color:var(--danger);margin:8px 0 0;min-height:1.2em}
[hidden]{display:none!important}
</style>

<body class="out">
<main>
<h1>Essensplaner</h1>
<p class="sub">Gemeinsam Gerichte sammeln, Woche planen, einkaufen.</p>
<div id="login" class="card" hidden><strong>Anmelden</strong><label class="l" for="em">E-Mail</label><input type="text" id="em" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off"><label class="l" for="pw">Passwort</label><input type="password" id="pw" autocomplete="current-password"><p class="err" id="lerr" role="alert"></p><button class="btn" id="lgo">Anmelden</button></div>
<nav role="tablist">
<button role="tab" id="t-dishes" aria-selected="true">Gerichte</button>
<button role="tab" id="t-week" aria-selected="false">Woche<span class="n" id="cw">0</span></button>
<button role="tab" id="t-shop" aria-selected="false">Einkauf<span class="n" id="cs">0</span></button>
<button role="tab" id="t-home" aria-selected="false">Vorrat</button>
</nav>

<section id="v-dishes">
<div class="card" id="form">
<strong id="ftitle">Neues Gericht</strong>
<label class="l" for="dn">Name</label>
<input type="text" id="dn" placeholder="z. B. Spaghetti Bolognese" autocomplete="off">
<label class="l">Zutaten</label>
<div id="ings"></div>
<button class="btn ghost sm" id="adding">+ Zutat</button>
<div class="row" style="margin-top:14px">
<button class="btn" id="save">Gericht speichern</button>
<button class="btn ghost" id="cancel" hidden>Abbrechen</button>
</div>
</div>
<div id="dishlist"></div>
</section>

<section id="v-week" hidden><div id="weeklist"></div></section>

<section id="v-shop" hidden>
<div class="card row" id="mform">
<input type="text" id="mi" class="grow" placeholder="Eigenen Artikel hinzufügen" aria-label="Eigener Artikel" autocomplete="off">
<button class="btn" id="madd">Hinzufügen</button>
</div>
<div class="card" id="shoplist"></div>
<div class="row"><button class="btn ghost sm" id="clr">Einkauf abschließen</button><button class="btn ghost sm" id="cp">Liste kopieren</button></div>
<p class="hint">„Einkauf abschließen“ löscht abgehakte eigene Artikel und setzt alle Haken zurück.</p>
</section>
<section id="v-home" hidden>
<div class="card row"><input type="text" id="pi" class="grow" placeholder="Was hast du zuhause? z. B. Nudeln" aria-label="Lebensmittel zuhause" autocomplete="off"><button class="btn" id="padd">Hinzufügen</button></div>
<div class="card" id="pantry"></div>
<h2 class="h2">Passende Gerichte</h2>
<div id="match"></div>
</section>
</main>
<div id="msg" hidden></div>

<script>
(function(){
var UNITS=["","g","kg","ml","l","Stk","EL","TL","Pck","Dose","Bund"];
var dishes=[],manual=[],pantry=[],ist={},db=null,tab="dishes",editId=null,ingRows=[];
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(t){var m=$("msg");m.textContent=t;m.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){m.hidden=true},3500)}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return "k"+(h>>>0).toString(36)}
function norm(x){return String(x).toLowerCase().trim()}
function mt(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(b.length>=3&&a.indexOf(b)>=0)||(a.length>=3&&b.indexOf(a)>=0)}
function have(n){return pantry.some(function(p){return mt(n,p.name)})}
function addPantry(name){name=name.trim();if(!name||!db)return;if(pantry.some(function(p){return norm(p.name)===norm(name)}))return;guard(db.collection("pantry").add({name:name}))}
function itemById(id){return allItems().filter(function(x){return x.kind==="d"&&x.id===id})[0]}
function toPantry(id){var it=itemById(id);if(it)addPantry(it.n)}
function outPantry(id){var it=itemById(id);if(it)pantry.filter(function(p){return mt(it.n,p.name)}).forEach(function(p){guard(db.collection("pantry").doc(p.id).delete())})}
function num(v){var x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:null}
function fq(q){return String(Math.round(q*100)/100).replace(".",",")}
function stepFor(u){return u==="g"||u==="ml"?50:(u==="kg"||u==="l"?0.5:1)}
function guard(p){return Promise.resolve(p).catch(function(){toast("Speichern nicht möglich. Dir fehlt evtl. die Schreibberechtigung.")})}

function setTab(t){tab=t;["dishes","week","shop","home"].forEach(function(n){$("v-"+n).hidden=n!==t;$("t-"+n).setAttribute("aria-selected",n===t)});render()}
$("t-dishes").onclick=function(){setTab("dishes")};
$("t-week").onclick=function(){setTab("week")};
$("t-shop").onclick=function(){setTab("shop")};
$("t-home").onclick=function(){setTab("home")};

/* Zutaten-Formular */
function drawIngs(){
  $("ings").innerHTML=ingRows.map(function(r,i){
    return '<div class="ing"><input type="number" inputmode="decimal" step="any" min="0" placeholder="Menge" aria-label="Menge" data-i="'+i+'" data-f="q" value="'+esc(r.q)+'">'+
    '<select aria-label="Einheit" data-i="'+i+'" data-f="u">'+UNITS.map(function(u){return '<option value="'+u+'"'+(u===r.u?" selected":"")+'>'+(u||"–")+'</option>'}).join("")+'</select>'+
    '<input type="text" placeholder="Zutat" aria-label="Zutat" autocomplete="off" data-i="'+i+'" data-f="n" value="'+esc(r.n)+'">'+
    '<button class="x" data-rm="'+i+'" aria-label="Zutat entfernen">×</button></div>'}).join("");
}
function resetForm(){editId=null;$("dn").value="";ingRows=[{q:"",u:"",n:""}];$("ftitle").textContent="Neues Gericht";$("cancel").hidden=true;drawIngs()}
$("adding").onclick=function(){ingRows.push({q:"",u:"",n:""});drawIngs();var l=$("ings").querySelectorAll('input[data-f="n"]');l[l.length-1].focus()};
$("ings").addEventListener("input",function(e){var t=e.target,i=t.getAttribute("data-i");if(i!==null)ingRows[i][t.getAttribute("data-f")]=t.value});
$("ings").addEventListener("change",function(e){var t=e.target,i=t.getAttribute("data-i");if(i!==null)ingRows[i][t.getAttribute("data-f")]=t.value});
$("ings").addEventListener("click",function(e){var i=e.target.getAttribute("data-rm");if(i!==null){ingRows.splice(+i,1);if(!ingRows.length)ingRows.push({q:"",u:"",n:""});drawIngs()}});
$("cancel").onclick=resetForm;
$("save").onclick=function(){
  if(!db)return;
  var n=$("dn").value.trim();if(!n){$("dn").focus();return}
  var ing=ingRows.filter(function(r){return r.n.trim()}).map(function(r){return{q:num(r.q),u:r.u,n:r.n.trim()}});
  var ref=editId?db.collection("dishes").doc(editId):db.collection("dishes").doc();
  var cur=dishes.filter(function(d){return d.id===editId})[0];
  guard(ref.set({name:n,ing:ing,week:cur?!!cur.week:false})).then(function(){resetForm()});
};

/* Gericht-Aktionen */
document.addEventListener("click",function(e){
  var t=e.target,id;
  if(!t.getAttribute)return;
  if(id=t.getAttribute("data-e")){var d=dishes.filter(function(x){return x.id===id})[0];if(!d)return;editId=id;$("dn").value=d.name;ingRows=d.ing.map(function(r){return{q:r.q===null?"":String(r.q),u:r.u||"",n:r.n}});if(!ingRows.length)ingRows=[{q:"",u:"",n:""}];$("ftitle").textContent="Gericht bearbeiten";$("cancel").hidden=false;drawIngs();$("form").scrollIntoView({behavior:"smooth"})}
  else if(id=t.getAttribute("data-d")){var dd=dishes.filter(function(x){return x.id===id})[0];if(dd&&confirm("„"+dd.name+"“ löschen?"))guard(db.collection("dishes").doc(id).delete())}
  else if(id=t.getAttribute("data-w2")){setWeek(id,false)}
  else if(id=t.getAttribute("data-m")){guard(db.collection("manual").doc(id).delete())}
  else if(id=t.getAttribute("data-h")){toPantry(id)}
  else if(id=t.getAttribute("data-nh")){outPantry(id)}
  else if(id=t.getAttribute("data-pd")){guard(db.collection("pantry").doc(id).delete())}
  else if(id=t.getAttribute("data-w3")){setWeek(id,true)}
  else if(id=t.getAttribute("data-s")){var p=id.split("~");adjust(p[0],p[1],+p[2])}
});
document.addEventListener("change",function(e){
  var t=e.target,id;if(!t.getAttribute)return;
  if(id=t.getAttribute("data-w"))setWeek(id,t.checked);
  else if(id=t.getAttribute("data-c")){var p=id.split("~");check(p[0],p[1],t.checked)}
});
function setWeek(id,v){var d=dishes.filter(function(x){return x.id===id})[0];if(d)guard(db.collection("dishes").doc(id).update({week:v}))}

/* Einkaufsliste */
function derived(){
  var map={},order=[];
  dishes.filter(function(d){return d.week}).forEach(function(d){
    (d.ing||[]).forEach(function(r){
      var u=r.u||"",key=u.toLowerCase()+"|"+r.n.toLowerCase(),q=r.q===null||r.q===undefined?1:r.q;
      if(map[key]){map[key].q+=q;if(map[key].src.indexOf(d.name)<0)map[key].src.push(d.name)}
      else{map[key]={kind:"d",id:hash(key),key:key,q:q,u:u,n:r.n,src:[d.name]};order.push(key)}
    });
  });
  return order.map(function(k){var it=map[k],s=ist[it.id]||{};it.delta=s.delta||0;it.checked=!!s.checked;it.home=have(it.n);it.eq=Math.max(0,Math.round((it.q+it.delta)*100)/100);return it});
}
function allItems(){
  var m=manual.map(function(x){return{kind:"m",id:x.id,q:x.q,eq:x.q,u:x.u||"",n:x.name,checked:!!x.checked,home:false,src:[]}});
  return derived().concat(m);
}
function adjust(kind,id,dir){
  var it=allItems().filter(function(x){return x.kind===kind&&x.id===id})[0];if(!it)return;
  var st=stepFor(it.u),nq=Math.max(0,Math.round((it.eq+dir*st)*100)/100);
  if(kind==="m")guard(db.collection("manual").doc(id).update({q:nq}));
  else{var s=ist[id]||{};guard(db.collection("istate").doc(id).set({delta:Math.round((nq-it.q)*100)/100,checked:!!s.checked}))}
}
function check(kind,id,v){
  if(kind==="m")guard(db.collection("manual").doc(id).update({checked:v}));
  else{var s=ist[id]||{};guard(db.collection("istate").doc(id).set({delta:s.delta||0,checked:v}))}
}
function addManual(){
  var v=$("mi").value.trim();if(!v){$("mi").focus();return}
  if(!db)return;
  guard(db.collection("manual").add({name:v,q:1,u:"",checked:false}));$("mi").value="";$("mi").focus();
}
$("madd").onclick=addManual;
$("mi").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addManual()}});
$("clr").onclick=function(){
  if(!db||!confirm("Einkauf abschließen? Abgehakte eigene Artikel werden gelöscht, alle Haken zurückgesetzt."))return;
  manual.forEach(function(m){if(m.checked)guard(db.collection("manual").doc(m.id).delete())});
  Object.keys(ist).forEach(function(k){if(ist[k].checked)guard(db.collection("istate").doc(k).update({checked:false}))});
};
function line(i){return fq(i.eq)+(i.u?" "+i.u:"")+" "+i.n}
$("cp").onclick=function(){
  var txt=allItems().filter(function(i){return !i.checked&&!i.home&&i.eq>0}).map(line).join("\n");
  try{navigator.clipboard.writeText(txt);$("cp").textContent="Kopiert"}catch(e){$("cp").textContent="Nicht möglich"}
  setTimeout(function(){$("cp").textContent="Liste kopieren"},1500)};

function render(){
  var wk=dishes.filter(function(d){return d.week}),items=allItems();
  $("cw").textContent=wk.length;
  $("cs").textContent=items.filter(function(i){return !i.checked&&!i.home&&i.eq>0}).length;
  var ul=function(d){return (d.ing&&d.ing.length)?'<ul>'+d.ing.map(function(r){return '<li>'+esc((r.q!==null&&r.q!==undefined?fq(r.q)+(r.u?" "+r.u:"")+" ":"")+r.n)+'</li>'}).join("")+'</ul>':'<ul><li>Keine Zutaten</li></ul>'};
  if(tab==="dishes"){
    $("dishlist").innerHTML=dishes.length?dishes.map(function(d){
      return '<div class="card dish'+(d.week?" on":"")+'"><h3>'+esc(d.name)+'</h3>'+ul(d)+
      '<div class="row"><label class="pick"><input type="checkbox" data-w="'+d.id+'"'+(d.week?" checked":"")+'>Diese Woche</label><span class="grow"></span>'+
      '<button class="btn ghost sm" data-e="'+d.id+'">Bearbeiten</button><button class="x" data-d="'+d.id+'" aria-label="'+esc(d.name)+' löschen">×</button></div></div>'}).join("")
      :'<div class="empty">Noch keine Gerichte. Speichere oben das erste.</div>';
  }
  if(tab==="week"){
    $("weeklist").innerHTML=wk.length?wk.map(function(d){
      return '<div class="card dish on"><h3>'+esc(d.name)+'</h3>'+ul(d)+'<button class="btn ghost sm" data-w2="'+d.id+'">Aus Woche entfernen</button></div>'}).join("")
      :'<div class="empty">Noch nichts geplant. Hake bei „Gerichte“ an, was ihr diese Woche kochen wollt.</div>';
  }
  if(tab==="shop"){
    var rowH=function(i){var k=i.kind+"~"+i.id;
      return '<div class="item'+(i.checked||i.eq<=0?" done":"")+'"><input type="checkbox" aria-label="abhaken" data-c="'+k+'"'+(i.checked?" checked":"")+'>'+
      '<div class="t"><b>'+esc(i.n)+'</b>'+(i.src.length?'<span class="src">'+esc(i.src.join(", "))+'</span>':'')+(i.kind==="d"?'<button class="lnk" data-h="'+i.id+'">Schon zuhause</button>':'')+'</div>'+
      '<div class="step"><button data-s="'+k+'~-1" aria-label="weniger">−</button><span>'+fq(i.eq)+(i.u?" "+esc(i.u):"")+'</span><button data-s="'+k+'~1" aria-label="mehr">+</button></div>'+
      (i.kind==="m"?'<button class="x" data-m="'+i.id+'" aria-label="löschen">×</button>':'')+'</div>'};
    var buy=items.filter(function(i){return !i.home}),inh=items.filter(function(i){return i.home});
    $("shoplist").innerHTML=(buy.length?buy.map(rowH).join(""):'<div class="empty">Die Liste ist leer. Plane Gerichte oder füge oben etwas hinzu.</div>')+
      (inh.length?'<h2 class="h2">Schon zuhause ('+inh.length+')</h2>'+inh.map(function(i){return '<div class="item done"><div class="t"><b>'+esc(i.n)+'</b><span class="src">'+esc(i.src.join(", "))+'</span></div><button class="btn ghost sm" data-nh="'+i.id+'">Doch kaufen</button></div>'}).join(""):"");
  }
  if(tab==="home"){
    $("pantry").innerHTML=pantry.length?pantry.map(function(p){return '<span class="chip">'+esc(p.name)+'<button class="x" data-pd="'+p.id+'" aria-label="'+esc(p.name)+' entfernen">×</button></span>'}).join(""):'<div class="empty">Noch nichts eingetragen.</div>';
    var res=dishes.map(function(d){var ing=d.ing||[];var miss=ing.filter(function(r){return !have(r.n)});return{d:d,tot:ing.length,got:ing.length-miss.length,miss:miss}})
      .filter(function(x){return x.tot>0&&x.got>0}).sort(function(a,b){return a.miss.length-b.miss.length||(b.got/b.tot)-(a.got/a.tot)});
    $("match").innerHTML=!pantry.length?'<div class="empty">Trag oben ein, was du zuhause hast. Dann siehst du hier, was du damit kochen kannst.</div>'
      :res.length?res.map(function(x){return '<div class="card dish'+(x.d.week?" on":"")+'"><h3>'+esc(x.d.name)+'</h3><p class="hint">'+x.got+' von '+x.tot+' Zutaten da'+(x.miss.length?'. Es fehlt: '+esc(x.miss.map(function(r){return r.n}).join(", ")):'. Alles da!')+'</p>'+
        (x.d.week?'<span class="src">Schon in der Woche</span>':'<button class="btn ghost sm" data-w3="'+x.d.id+'" style="margin-top:8px">In die Woche</button>')+'</div>'}).join("")
      :'<div class="empty">Zu deinem Vorrat passt noch kein gespeichertes Gericht.</div>';
  }
}


function supaDb(sb){
  var cache={},subs={};
  function snap(col){var m=cache[col]||{};return{docs:Object.keys(m).map(function(id){return{id:id,data:function(){return m[id]}}})}}
  function emit(col){(subs[col]||[]).forEach(function(f){f(snap(col))})}
  function fail(r){if(r.error){load();throw r.error}}
  function put(col,id,data){(cache[col]=cache[col]||{})[id]=data;emit(col);return sb.from("items").upsert({col:col,id:id,data:data}).then(fail)}
  function del(col,id){if(cache[col])delete cache[col][id];emit(col);return sb.from("items").delete().eq("col",col).eq("id",id).then(fail)}
  async function load(){var r=await sb.from("items").select("col,id,data");if(r.error)throw r.error;cache={};r.data.forEach(function(x){(cache[x.col]=cache[x.col]||{})[x.id]=x.data});Object.keys(subs).forEach(emit)}
  sb.channel("items-live").on("postgres_changes",{event:"*",schema:"public",table:"items"},function(p){
    var row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.col)return;
    var c=cache[row.col]=cache[row.col]||{};
    if(p.eventType==="DELETE")delete c[row.id];else c[row.id]=row.data;
    emit(row.col)}).subscribe();
  function docRef(col,id){return{id:id,
    set:function(d){return put(col,id,d)},
    update:function(d){return put(col,id,Object.assign({},(cache[col]||{})[id]||{},d))},
    delete:function(){return del(col,id)}}}
  return{load:load,collection:function(col){return{
    doc:function(id){return docRef(col,id||crypto.randomUUID())},
    add:function(d){var id=crypto.randomUUID();return put(col,id,d).then(function(){return docRef(col,id)})},
    onSnapshot:function(next){(subs[col]=subs[col]||[]).push(next);next(snap(col));return function(){}}}}}
}
